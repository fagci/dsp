<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161a1d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; script-src 'self' http: https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'">
<title>DSP</title>
<link rel="stylesheet" href="styles.css?v=110">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div id="app">
  <div id="side">
    <h1>DSP</h1>
    <div id="sideTabs">
      <button class="sidetab on" data-tab="modules">Modules</button>
      <button class="sidetab" data-tab="patches">Patches</button>
    </div>
    <div id="panelModules" class="sidepanel on">
      <div id="paletteTools"><input id="paletteSearch" type="search" placeholder="Find a module… (Ctrl+K)" autocomplete="off"><button id="paletteClear" title="Clear search">×</button></div>
      <div id="palette"></div>
    </div>
    <div id="panelPatches" class="sidepanel">
      <div id="patchTools">
        <input id="patchSearch" type="search" placeholder="Find a patch…" autocomplete="off">
        <button id="patchClear" title="Clear search">×</button>
        <button id="psave" title="Save current patch">💾</button>
      </div>
      <div id="patchList"></div>
    </div>
  </div>
  <div id="main">
    <div id="bar">
      <button id="menu" title="Show / hide sidebar">☰</button>
      <button id="run" title="Run / stop">▶</button>
      <button id="dash" title="Dashboard view — pick a module in each pane, split panes and drag dividers to arrange them">▦</button>
      <button id="fit" title="Fit to screen">⤢</button>
      <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
      <span class="sep"></span>
      <button id="dup" title="Duplicate (D)">⧉ copy</button>
      <button id="save" title="Download to file">⭳ file</button>
      <button id="load" title="Open file">⭱ open</button>
      <button id="clear" title="Clear canvas">✕ clear</button>
      <button id="wipe" title="Erase all local data (presets, patches, cache) — for testing">⟲ reset</button>
      <span class="sep"></span>
      <select id="turbo" title="Run speed">
        <option value="1">×1</option><option value="2">×2</option><option value="4">×4</option>
        <option value="8">×8</option><option value="16">×16</option><option value="32">×32</option>
      </select>
      <select id="blk" title="Block size">
        <option value="128">128</option><option value="256">256</option>
        <option value="512" selected>512</option><option value="1024">1024</option>
        <option value="2048">2048</option>
      </select>
      <select id="sr" title="Sample rate">
        <option value="">default</option>
        <option value="8000">8000 Hz</option>
        <option value="11025">11025 Hz</option>
        <option value="16000">16000 Hz</option>
        <option value="22050">22050 Hz</option>
        <option value="44100">44100 Hz</option>
        <option value="48000">48000 Hz</option>
        <option value="96000">96000 Hz</option>
        <option value="192000">192000 Hz</option>
      </select>
      <span class="sp"></span>
      <span id="stat">stopped</span>
    </div>
    <div id="canvas" class="grab">
      <svg id="wires"></svg>
      <div id="content"></div>
      <div id="dashGrid"></div>
      <div id="hint">Shift+click — select multiple · D duplicate · Ctrl+Z undo · Del delete</div>
    </div>
  </div>
</div>
<div id="scrim"></div>
<div id="toast"></div>
<input type="file" id="fpick" accept=".json" hidden>

<!-- panzoom/interactjs vendored locally (vendor/) — CDN dependency was breaking the whole app offline -->
<script src="vendor/panzoom.min.js?v=4.6.2"></script>
<script src="vendor/interact.min.js?v=1.10.28"></script>
<script src="vendor/satellite.min.js?v=5.0.0"></script>
<!-- modules are listed here by hand, no auto-discovery: add a file under modules/ — add its line here too -->
<div id="boot"><div id="bootTxt">Loading… 0/44</div><div id="bootBar"><i></i></div></div>
<script>
// скрипты грузятся по порядку (async=false), прогресс — по числу загруженных
(()=>{
  const V='110', L=["core-dsp.js", "core-engine.js", "core-islands.js", "modules/analysis.js", "modules/misc.js", "modules/modulation.js", "modules/output.js", "modules/processing.js", "modules/protocols.js", "modules/sigid.js", "modules/sources.js", "modules/audioeditor.js", "modules/tracker-formats.js", "modules/tracker-player.js", "modules/tracker.js", "modules/tracker-session.js", "modules/tracker-panels.js", "modules/sampler.js", "modules/tinysa.js", "modules/hfdl.js", "modules/gsm.js", "modules/propagation.js", "modules/geo.js", "modules/sked.js", "modules/sat.js", "modules/radio.js", "modules/iq-kernels.js", "modules/ccsds-kernels.js", "modules/lrpt-msumr.js", "modules/sonde-kernels.js", "modules/inmarsat-kernels.js", "modules/mpt1327-kernels.js", "modules/ism-kernels.js", "modules/fsk4-kernels.js", "modules/dmr-kernels.js", "modules/p25-kernels.js", "modules/nxdn-kernels.js", "modules/m17-kernels.js", "modules/ysf-kernels.js", "modules/dstar-kernels.js", "modules/dpmr-kernels.js", "modules/video-kernels.js", "modules/iq.js", "modules/adsb.js", "modules/lrpt.js", "modules/sonde.js", "modules/inmarsat.js", "modules/mpt1327.js", "modules/ism.js", "modules/dmr.js", "modules/fsk4.js", "modules/mbe-tables.js", "modules/mbe.js", "modules/comms.js", "modules/video.js", "presets.js", "core-graph.js"], txt=document.getElementById('bootTxt'), bar=document.querySelector('#bootBar i'), boot=document.getElementById('boot');
  let n=0;
  const step=()=>{ txt.textContent='Loading… '+n+'/'+L.length; bar.style.width=(100*n/L.length)+'%'; };
  const fail=u=>{ txt.textContent='Failed to load '+u+' — reload the page'; boot.classList.add('err'); };
  for(const u of L){
    const e=document.createElement('script'); e.src=u+'?v='+V; e.async=false;
    e.onload=()=>{ step(); if(++n===L.length) boot.remove(); };
    e.onerror=()=>fail(u);
    document.head.appendChild(e);
  }
})();
</script>
<script>
// офлайн-шелл — без него установленный PWA (иконка на главном экране) без сети показывает
// нативный экран «нет подключения» вместо приложения, хотя весь DSP считается локально
if('serviceWorker' in navigator) window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // COOP/COEP ставит сервис-воркер (см. sw.js) — при первой установке страница ещё не под ним,
  // перезагружаем один раз (флаг в localStorage — браузер без credentialless не будет крутиться в перезагрузках), чтобы стала cross-origin isolated и движок перешёл на SharedArrayBuffer
  if(window.crossOriginIsolated===false){
    const reloadOnce=()=>{ try{ if(localStorage.getItem('coiReload')) return; localStorage.setItem('coiReload','1'); }catch(e){ return; } location.reload(); };
    if(navigator.serviceWorker.controller) reloadOnce();
    else navigator.serviceWorker.addEventListener('controllerchange', reloadOnce, {once:true});
  }
});
</script>
</body></html>
