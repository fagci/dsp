<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161a1d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; script-src 'self' http: https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'">
<title>DSP</title>
<link rel="stylesheet" href="styles.css?v=180">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div id="boot"><div id="bootTxt">Loading… 0/0</div><div id="bootBar"><i></i></div></div>
<script>
// прогресс сразу, до раскладки; скрипты грузятся по порядку (async=false)
(()=>{
  const V='231', L=["core-dsp.js", "core-engine.js", "core-islands.js", "modules/analysis.js", "modules/bandplan-data.js", "modules/sa-panes.js", "modules/misc.js", "modules/modulation.js", "modules/output.js", "modules/processing.js", "modules/protocols.js", "modules/sigid.js", "modules/sources.js", "modules/audioeditor.js", "modules/tracker-formats.js", "modules/tracker-player.js", "modules/tracker.js", "modules/tracker-session.js", "modules/tracker-panels.js", "modules/sampler.js", "modules/tinysa.js", "modules/espsdr.js", "modules/hfdl.js", "modules/gsm-kernels.js", "modules/gsm.js", "modules/propagation.js", "modules/geo.js", "modules/sequencer.js", "modules/table.js", "modules/logic.js", "modules/indicators.js", "modules/logicusb.js", "modules/logican.js", "modules/sked.js", "modules/sat.js", "modules/horizon.js", "modules/overlay.js", "modules/radio.js", "modules/simd-kernels.js", "modules/iq-kernels.js", "modules/ccsds-kernels.js", "modules/lrpt-msumr.js", "modules/sonde-kernels.js", "modules/inmarsat-kernels.js", "modules/mpt1327-kernels.js", "modules/ism-kernels.js", "modules/lora-kernels.js", "modules/ais-kernels.js", "modules/pocsag-kernels.js", "modules/timecode-kernels.js", "modules/acars-kernels.js", "modules/fsk4-kernels.js", "modules/dmr-kernels.js", "modules/p25-kernels.js", "modules/nxdn-kernels.js", "modules/m17-kernels.js", "modules/ysf-kernels.js", "modules/dstar-kernels.js", "modules/dpmr-kernels.js", "modules/sym-kernels.js", "modules/blind-kernels.js", "modules/sigdb-kernels.js", "modules/tetra-kernels.js", "modules/video-kernels.js", "modules/iq.js", "modules/adsb.js", "modules/lrpt.js", "modules/sonde.js", "modules/inmarsat.js", "modules/mpt1327.js", "modules/ism.js", "modules/lora.js", "modules/ais.js", "modules/pocsag.js", "modules/timecode.js", "modules/same.js", "modules/selcal.js", "modules/fivetone.js", "modules/js8-kernels.js", "modules/js8.js", "modules/acars.js", "modules/dmr.js", "modules/fsk4.js", "modules/sym.js", "modules/blind.js", "modules/tetra.js", "modules/voicecrypt.js", "modules/mbe-tables.js", "modules/mbe.js", "modules/comms.js", "modules/video.js", "modules/ir-kernels.js", "modules/ir.js", "modules/mqtt-kernels.js", "modules/mqtt.js", "modules/nmea.js", "modules/ble-kernels.js", "modules/ble.js", "modules/iqnet.js", "modules/gamepad.js", "modules/webhid.js", "modules/webnfc.js", "modules/speech.js", "modules/webrtc.js", "modules/otherworld.js", "modules/graphview.js", "modules/chat.js", "modules/games.js", "presets.js", "core-graph.js", "modules/power.js"], txt=document.getElementById('bootTxt'), bar=document.querySelector('#bootBar i'), boot=document.getElementById('boot');
  let n=0;
  const step=()=>{ txt.textContent='Loading… '+n+'/'+L.length; bar.style.width=(100*n/L.length)+'%'; };
  const fail=u=>{ txt.textContent=(navigator.onLine?'Failed to load ':'Offline, not cached: ')+u+' — reload the page'; boot.classList.add('err'); };
  step();
  const add=(u,retry)=>{
    const e=document.createElement('script'); e.src=u+'?v='+V; e.async=false;
    e.onload=()=>{ step(); if(++n===L.length) boot.remove(); };
    e.onerror=()=>{ e.remove(); retry?add(u,false):fail(u); };
    document.head.appendChild(e);
  };
  // модулям нужен DOM (#canvas и т.д.) — стартуем после разбора страницы
  const go=()=>{ for(const u of L) add(u,true); };
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',go):go();
})();
</script>
<div id="app">
  <div id="side">
    <h1>DSP</h1>
    <div id="sideTabs">
      <button class="sidetab on" data-tab="modules">Modules</button>
      <button class="sidetab" data-tab="patches">Patches</button>
    </div>
    <div id="panelModules" class="sidepanel on">
      <div id="paletteTools"><input id="paletteSearch" type="search" placeholder="Find a module… (Ctrl+K)" autocomplete="off"></div>
      <div id="palette"></div>
      <div id="palLegend"><span><span class="mi" data-role="source"></span>source</span><span><span class="mi" data-role="proc"></span>process</span><span><span class="mi" data-role="sink"></span>sink</span></div>
    </div>
    <div id="panelPatches" class="sidepanel">
      <div id="patchTools">
        <input id="patchSearch" type="search" placeholder="Find a patch…" autocomplete="off">
        <button id="psave" title="Save current patch"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg></button>
      </div>
      <div id="patchList"></div>
    </div>
  </div>
  <div id="main">
    <div id="bar">
      <button id="menu" title="Show / hide sidebar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button id="load" title="Open file"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a1 1 0 011-1h5l2 2h8a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg></button>
      <button id="save" title="Save to file"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <span class="sep"></span>
      <button id="run" title="Run / stop"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></button>
      <span class="sep"></span>
      <button id="undo" title="Undo (Ctrl+Z)" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button id="dup" title="Duplicate (D)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 011-1h10"/></svg></button>
      <button id="chain" title="Add a module to the selected one: shows only what fits its free output, connects it and selects it — tap again to keep building the chain" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h9"/><path d="M9 8l4 4-4 4"/><path d="M18 8v8M14 12h8"/></svg></button>
      <button id="clear" title="Clear canvas">clr</button>
      <span class="sep"></span>
      <button id="fit" title="Fit to screen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="lod" title="Detail level for all modules: full → compact → dots"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg></button>
      <button id="dash" title="Dashboard view — pick a module in each pane, split panes and drag dividers to arrange them"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
      <button id="power" title="Power profile: CPU share of every module (processing + drawing), skipped unused modules, battery drain"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></button>
      <span class="sep"></span>
      <select id="turbo" title="Run speed">
        <option value="1">×1</option><option value="2">×2</option><option value="4">×4</option>
        <option value="8">×8</option><option value="16">×16</option><option value="32">×32</option>
      </select>
      <select id="blk" title="Block size">
        <option value="128">128</option><option value="256">256</option>
        <option value="512" selected>512</option><option value="1024">1024</option>
        <option value="2048">2048</option>
      </select>
      <select id="fps" title="Redraw rate: auto slows down when idle, max keeps 60 fps (heavier on the main thread), min saves CPU (10 fps)">
        <option value="auto">fps auto</option><option value="max" selected>fps max</option><option value="min">fps min</option>
      </select>
      <select id="sr" title="Sample rate">
        <option value="">default</option>
        <option value="8000">8000 Hz</option>
        <option value="11025">11025 Hz</option>
        <option value="16000">16000 Hz</option>
        <option value="22050">22050 Hz</option>
        <option value="44100">44100 Hz</option>
        <option value="48000">48000 Hz</option>
        <option value="96000">96000 Hz</option>
        <option value="192000">192000 Hz</option>
      </select>
      <span class="sp"></span>
      <span id="net" hidden>offline</span>
      <span id="stat">stopped</span>
      <button id="wipe" title="Refresh app files and cache (patches are kept); Cancel in the dialog offers a full erase"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
    <div id="canvas" class="grab">
      <svg id="wires"></svg>
      <div id="content"></div>
      <div id="dashGrid"></div>
    </div>
  </div>
</div>
<div id="scrim"></div>
<div id="toast"></div>
<input type="file" id="fpick" accept=".json" hidden>

<!-- panzoom/interactjs vendored locally (vendor/) — CDN dependency was breaking the whole app offline -->
<script src="vendor/panzoom.min.js?v=4.6.2"></script>
<script src="vendor/interact.min.js?v=1.10.28"></script>
<script src="vendor/satellite.min.js?v=5.0.0"></script>
<!-- модули перечислены вручную в массиве L (скрипт в <head>), без автопоиска: новый файл — добавить и в L, и в SHELL в sw.js; V бампать вместе с CACHE в sw.js -->
<script>
// индикатор: нет сети — работаем офлайн (весь DSP локальный)
(()=>{ const n=document.getElementById('net'), u=()=>{ n.hidden=navigator.onLine; };
  addEventListener('online',u); addEventListener('offline',u); u(); })();
</script>
<script>
// офлайн-шелл — без него установленный PWA (иконка на главном экране) без сети показывает
// нативный экран «нет подключения» вместо приложения, хотя весь DSP считается локально
if('serviceWorker' in navigator) window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // COOP/COEP ставит сервис-воркер (см. sw.js) — при первой установке страница ещё не под ним,
  // перезагружаем один раз (флаг в localStorage — браузер без credentialless не будет крутиться в перезагрузках), чтобы стала cross-origin isolated и движок перешёл на SharedArrayBuffer
  if(window.crossOriginIsolated===false){
    const reloadOnce=()=>{ try{ if(localStorage.getItem('coiReload')) return; localStorage.setItem('coiReload','1'); }catch(e){ return; } location.reload(); };
    if(navigator.serviceWorker.controller) reloadOnce();
    else navigator.serviceWorker.addEventListener('controllerchange', reloadOnce, {once:true});
  }
});
</script>
</body></html>
