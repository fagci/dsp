<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161a1d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; script-src 'self' http: https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'">
<title>DSP</title>
<link rel="stylesheet" href="styles.css?v=136">

<body>
<div id="boot"><div id="bootTxt">Loading… 0/0</div><div id="bootBar"><i></i></div></div>
<script>
// ──────────────────────────────────────────────────────────────────────────────
// Boot loader — synchronous script injection (async=false) so modules load in order
// ──────────────────────────────────────────────────────────────────────────────
(()=>{
  const V='132';
  const L=[
    "core-dsp.js","core-engine.js","core-islands.js",
    "modules/analysis.js","modules/misc.js","modules/modulation.js","modules/output.js",
    "modules/processing.js","modules/protocols.js","modules/sigid.js","modules/sources.js",
    "modules/audioeditor.js","modules/tracker-formats.js","modules/tracker-player.js",
    "modules/tracker.js","modules/tracker-session.js","modules/tracker-panels.js",
    "modules/sampler.js","modules/tinysa.js","modules/hfdl.js","modules/gsm.js",
    "modules/propagation.js","modules/geo.js","modules/sequencer.js","modules/logic.js",
    "modules/logican.js","modules/sked.js","modules/sat.js","modules/radio.js",
    "modules/iq-kernels.js","modules/ccsds-kernels.js","modules/lrpt-msumr.js",
    "modules/sonde-kernels.js","modules/inmarsat-kernels.js","modules/mpt1327-kernels.js",
    "modules/ism-kernels.js","modules/acars-kernels.js","modules/fsk4-kernels.js",
    "modules/dmr-kernels.js","modules/p25-kernels.js","modules/nxdn-kernels.js",
    "modules/m17-kernels.js","modules/ysf-kernels.js","modules/dstar-kernels.js",
    "modules/dpmr-kernels.js","modules/video-kernels.js","modules/iq.js","modules/adsb.js",
    "modules/lrpt.js","modules/sonde.js","modules/inmarsat.js","modules/mpt1327.js",
    "modules/ism.js","modules/acars.js","modules/dmr.js","modules/fsk4.js",
    "modules/voicecrypt.js","modules/mbe-tables.js","modules/mbe.js","modules/comms.js",
    "modules/video.js","presets.js","core-graph.js"
  ];
  const txt=document.getElementById('bootTxt');
  const bar=document.querySelector('#bootBar i');
  const boot=document.getElementById('boot');
  let n=0;
  const step=()=>{ txt.textContent='Loading… '+n+'/'+L.length; bar.style.width=(100*n/L.length)+'%'; };
  const fail=u=>{ txt.textContent=(navigator.onLine?'Failed to load ':'Offline, not cached: ')+u+' — reload the page'; boot.classList.add('err'); };
  step();
  const add=(u,retry)=>{
    const e=document.createElement('script');
    e.src=u+'?v='+V;
    e.async=false;                     // важно: строгий порядок загрузки
    e.onload=()=>{ step(); if(++n===L.length) boot.remove(); };
    e.onerror=()=>{ e.remove(); retry?add(u,false):fail(u); };
    document.head.appendChild(e);
  };
  // стартуем сразу после DOMContentLoaded — DOM уже готов, скрипты грузятся синхронно
  const go=()=>{ for(const u of L) add(u,true); };
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',go):go();
})();
</script>

<div id="app">
  <div id="side">
    <h1>DSP</h1>
    <div id="sideTabs">
      <button class="sidetab on" data-tab="modules">Modules</button>
      <button class="sidetab" data-tab="patches">Patches</button>
    </div>
    <div id="panelModules" class="sidepanel on">
      <div id="paletteTools"><input id="paletteSearch" type="search" placeholder="Find a module… (Ctrl+K)" autocomplete="off"></div>
      <div id="palette"></div>
    </div>
    <div id="panelPatches" class="sidepanel">
      <div id="patchTools">
        <input id="patchSearch" type="search" placeholder="Find a patch…" autocomplete="off">
        <button id="psave" title="Save current patch"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg></button>
      </div>
      <div id="patchList"></div>
    </div>
    <div id="buildInfo" class="build-info" title="Automatically generated from the deployed commit">Build…</div>
  </div>

  <div id="main">
    <div id="bar">
      <button id="menu" title="Show / hide sidebar" aria-label="Show or hide sidebar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button id="load" title="Open file" aria-label="Open patch file"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a1 1 0 011-1h5l2 2h8a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg></button>
      <button id="save" title="Save to file" aria-label="Save patch to file"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <span class="sep"></span>
      <button id="run" title="Run / stop" aria-label="Run or stop"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></button>
      <span class="sep"></span>
      <button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button id="dup" title="Duplicate (D)" aria-label="Duplicate selected module"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 011-1h10"/></svg></button>
      <span class="sep"></span>
      <button id="fit" title="Fit to screen" aria-label="Fit graph to screen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="dash" title="Dashboard view — pick a module in each pane, split panes and drag dividers to arrange them" aria-label="Toggle dashboard view"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>

      <!-- Settings popover -->
      <button id="engineToggle" class="toolbar-menu-trigger" type="button" popovertarget="enginePanel" title="Settings" aria-label="Settings" aria-controls="enginePanel" aria-expanded="false">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10m4 0h2M4 12h2m4 0h10M4 18h10m4 0h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg><span>Settings</span>
      </button>
      <div id="enginePanel" class="toolbar-popover" popover="auto" role="group" aria-labelledby="enginePanelTitle">
        <div id="enginePanelTitle" class="toolbar-popover-title">Settings</div>
        <div class="toolbar-settings">
          <label class="toolbar-setting">Run speed<select id="turbo" title="Run speed"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option><option value="8">×8</option><option value="16">×16</option><option value="32">×32</option></select></label>
          <label class="toolbar-setting">Block size<select id="blk" title="Block size"><option value="128">128</option><option value="256">256</option><option value="512" selected>512</option><option value="1024">1024</option><option value="2048">2048</option></select></label>
          <label class="toolbar-setting">Redraw rate<select id="fps" title="Redraw rate: auto slows down when idle, max keeps 60 fps (heavier on main thread), min saves CPU (10 fps)"><option value="auto">Auto</option><option value="max">Max</option><option value="min">Min</option></select></label>
          <label class="toolbar-setting">Sample rate<select id="sr" title="Sample rate"><option value="">Default</option><option value="8000">8000 Hz</option><option value="11025">11025 Hz</option><option value="16000">16000 Hz</option><option value="22050">22050 Hz</option><option value="44100">44100 Hz</option><option value="48000">48000 Hz</option><option value="96000">96000 Hz</option><option value="192000">192000 Hz</option></select></label>
        </div>
      </div>

      <!-- Clear actions popover -->
      <button id="moreToggle" class="toolbar-menu-trigger" type="button" popovertarget="morePanel" title="Clear actions" aria-label="Clear actions" aria-controls="morePanel" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Clear</span></button>
      <div id="morePanel" class="toolbar-popover" popover="auto" role="group" aria-label="Clear actions">
        <div class="toolbar-actions">
          <button id="clear" type="button" title="Clear canvas" aria-label="Clear canvas" popovertarget="morePanel" popovertargetaction="hide"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Clear canvas</span></button>
          <button id="wipe" type="button" class="danger" title="Erase all local data (presets, patches, cache)" aria-label="Erase all local data" popovertarget="morePanel" popovertargetaction="hide"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Erase local data…</span></button>
        </div>
      </div>

      <span class="sp"></span>
      <span id="net" hidden data-state="checking" role="status" aria-live="polite" title="Checking network">Offline</span>
      <span id="stat">stopped</span>
    </div>

    <div id="canvas" class="grab">
      <svg id="wires"></svg>
      <div id="content"></div>
      <div id="dashGrid"></div>
    </div>
  </div>
</div>

<div id="scrim"></div>
<div id="toast"></div>
<input type="file" id="fpick" accept=".json" hidden>

<!-- Vendored deps (offline-first) -->
<script src="vendor/panzoom.min.js?v=4.6.2"></script>
<script src="vendor/interact.min.js?v=1.10.28"></script>
<script src="vendor/satellite.min.js?v=5.0.0"></script>

<!-- ──────────────────────────────────────────────────────────────────────────────
     Offline / PWA / COOP-COEP bootstrap
     ──────────────────────────────────────────────────────────────────────────────
     ВАЖНО:
     1. COOP/COEP заголовки (Cross-Origin-Opener-Policy: same-origin,
        Cross-Origin-Embedder-Policy: require-corp) ДОЛЖНЫ отдаваться СЕРВЕРОМ
        (или через headers в static-хостинге: Netlify/Vercel/Cloudflare Pages/Apache/Nginx).
        Service Worker НЕ МОЖЕТ установить их для топ-левел документа.
     2. Без COOP/COEP crossOriginIsolated === false → SharedArrayBuffer недоступен.
     3. SW регистрируем РАНО (до загрузки модулей), чтобы он успел перехватить запросы.
     4. Перезагрузка для COOP/COEP делается ТОЛЬКО если сервер отдал правильные заголовки,
        но crossOriginIsolated всё равно false (браузер не дал isolation без перезагрузки).
     ────────────────────────────────────────────────────────────────────────────── -->
<script>
(() => {
  // 1) Регистрируем SW максимально рано — до загрузки модулей
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
  }

  // 2) Проверка COOP/COEP isolation — делаем один раз при загрузке
  //    Перезагружаемся только если сервер отдал правильные заголовки,
  //    но браузер не изолировал контекст (требует перезагрузки).
  const coiReloadFlag = 'coiReloadDone';
  if (window.crossOriginIsolated === false) {
    // Проверяем, не делали ли мы уже попытку
    const done = sessionStorage.getItem(coiReloadFlag);
    if (!done) {
      // Пробуем перезагрузить один раз за сессию
      sessionStorage.setItem(coiReloadFlag, '1');
      // Небольшая задержка, чтобы дать браузеру обработать заголовки
      setTimeout(() => location.reload(), 0);
    }
    // Если после перезагрузки всё равно false — значит сервер НЕ отдаёт COOP/COEP.
    // SharedArrayBuffer недоступен. Работаем без него (fallback в движке).
  } else {
    // Успешная изоляция — сбрасываем флаг, чтобы при следующей сессии проверить снова
    sessionStorage.removeItem(coiReloadFlag);
  }

  // 3) UI: сетевой статус и билд-инфо — после DOMContentLoaded
  document.addEventListener('DOMContentLoaded', () => {
    const netEl = document.getElementById('net');
    const buildEl = document.getElementById('buildInfo');

    // Network status — используем controller + cached флаг из SW (через message)
    let swCached = false;
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'CACHED_STATUS' });
    }
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'CACHED_STATUS') {
        swCached = e.data.cached;
        updateNet();
      }
    });

    const updateNet = () => {
      const online = navigator.onLine;
      netEl.hidden = online;
      netEl.dataset.state = online ? 'online' : (swCached ? 'offline-ready' : 'offline-unavailable');
      netEl.textContent = online ? '' : 'Offline';
      netEl.title = online ? '' : (swCached ? 'Offline; app shell is cached' : 'Offline; this tab is not controlled by the app cache');
    };
    window.addEventListener('online', updateNet);
    window.addEventListener('offline', updateNet);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) updateNet(); });
    updateNet();

    // Build info from version.json (no-cache)
    if (buildEl) {
      fetch('./version.json', { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('version unavailable'); return r.json(); })
        .then(v => {
          if (!v.commit) throw new Error('commit missing');
          const full = String(v.commit);
          buildEl.textContent = 'Build ' + full.slice(0, 7);
          buildEl.title = 'Commit ' + full + (v.builtAt ? ' · built ' + v.builtAt : '');
        })
        .catch(() => { buildEl.textContent = 'Build unavailable'; buildEl.title = 'Build ID appears after first online load'; });
    }
  });
})();
</script>
</body>
</html>
